name: Test and publish Dev Container Features

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: devcontainer-features-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate feature metadata
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  test-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli
      - name: Test latest HOL Guard as the non-root Dev Container user
        run: >-
          devcontainer features test
          --skip-scenarios
          -f hol-guard
          -i mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
          --remote-user vscode
          .

  test-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli
      - name: Test the pinned HOL Guard scenario
        run: >-
          devcontainer features test
          --skip-autogenerated
          -f hol-guard
          .

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - test-default
      - test-pinned
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish feature to GitHub Container Registry
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check anonymous package visibility
        continue-on-error: true
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker manifest inspect ghcr.io/kantorcodes/devcontainer-features/hol-guard:1 >/dev/null
